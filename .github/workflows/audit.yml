name: Audit

# Dependency advisories, checked by something other than a `git push` banner (ELEG-63).
#
# WHY THIS IS NOT A GATE IN scripts/gates.sh
#
# `scripts/gates.sh` is deliberately the single list of what has to pass, and CI runs
# exactly it (ELEG-5) — so the obvious move was to add `bun audit` there and let CI pick
# it up with no workflow edit. That was considered and rejected:
#
#   - `bun run gates` is otherwise deterministic and offline. `bun audit` queries the
#     registry's advisory feed, so the same commit passes today and fails tomorrow
#     because a third party published something.
#   - That turns a PR red for a reason that has nothing to do with the PR. This repo
#     works hard to keep "a red check on your branch is yours" true (ELEG-4, ELEG-62),
#     and a gate that goes red on its own is precisely how that signal is lost.
#
# So advisories get their own non-blocking job: it reports, it does not gate. Nothing
# here should ever be made a required check.
#
# Fixing what it finds is usually a FLOOR in `overrides` in package.json, not a manifest
# bump — see docs/dependencies.md for the reason behind every existing floor, and
# .github/dependabot.yml for why Dependabot cannot do it for us.

on:
  schedule:
    # Mondays, 06:00 UTC. Weekly matches the dependabot.yml cadence.
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - bun.lock
      - package.json
  pull_request:
    branches: [main]
    paths:
      - bun.lock
      - package.json
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact patch — see the note in ci.yml (ELEG-4).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: bun audit
        run: |
          bun audit --json > audit.json || true
          # `bun audit --json` is shaped { "<package>": [ {id,url,title,severity,
          # vulnerable_versions,cwe,cvss}, … ] } — flat, keyed by package, and with NO
          # `patched_versions` field. That is a different shape from the npm/pnpm
          # `{ advisories, metadata }` this step used to parse, which is why the script
          # was rewritten rather than repointed.
          bun -e '
            const raw = await Bun.file("audit.json").text();
            const data = raw.trim() ? JSON.parse(raw) : {};
            const rows = [];
            const counts = { critical: 0, high: 0, moderate: 0, low: 0, info: 0 };
            for (const [pkg, advisories] of Object.entries(data)) {
              for (const a of advisories) {
                counts[a.severity] = (counts[a.severity] ?? 0) + 1;
                rows.push(`| ${a.severity} | ${pkg} | \`${a.vulnerable_versions}\` | [${a.title.slice(0, 90)}](${a.url}) |`);
              }
            }
            const out = rows.length === 0
              ? "No known advisories in the dependency tree."
              : [
                  `**${rows.length} advisory/advisories** (critical ${counts.critical}, high ${counts.high}, moderate ${counts.moderate}, low ${counts.low}).`,
                  "",
                  "Fix by raising a floor in `overrides` in `package.json` — Dependabot cannot write those. See `docs/dependencies.md`.",
                  "",
                  "| severity | package | vulnerable | advisory |",
                  "| --- | --- | --- | --- |",
                  ...rows.sort(),
                ].join("\n");
            console.log(out);
            // appendFileSync, not Bun.write: the step summary is a shared file that
            // other steps also write to, and Bun.write would truncate theirs.
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
            // Never fail the job: this reports, it does not gate. See the header.
          '

# One compose file: the service you run, and the one you develop in.
#
#   docker compose --profile dev up -d --build
#   docker compose exec dev bun run gates
#
# WHAT STAYS ON THE HOST: the source, and nothing else. The bind mount below is the
# working tree, so an editor edits real files and git sees them normally.
#
# WHAT MOVES INTO VOLUMES: every generated directory, each one overlaid ON TOP of the
# bind mount at the same path. That is the whole trick — a named volume mounted at
# `/app/node_modules` hides whatever the bind mount has there (including nothing), so
# the container gets its own and the host directory is never created.
#
#     node_modules   552 MB
#     Playwright     1.3 GB   ← the largest, and it is not even in the project: it
#                               lives in ~/.cache/ms-playwright on a host install
#     data             7 MB   gcode cache, dryer session, debug captures
#     dist             2 MB   rebuilt by `bun run build`
#     test-results, playwright-report
#
# ONE REAL COST: with node_modules only inside the container, an editor's TypeScript
# server on the host has no types — no autocomplete, no go-to-definition, and every
# import underlined. Fix it by running the editor in the container too (VS Code Dev
# Containers, or JetBrains remote), which is the point of `.devcontainer` if you want
# one. There is no way to have both an empty host and a host language server.

services:
  # The service, built from this checkout.
  #
  # `build`, not `image`: if you have the repo you have the source, and building what is
  # in front of you is the thing that cannot be stale. The published image is for people
  # who do NOT have a checkout — that form is in README.md, and it is the same file with
  # `image: ghcr.io/gren-95/cc2-commander:latest` in place of these two lines.
  #
  # No `target`, so this is the last stage of the Dockerfile — the production image, the
  # same one `publish.yml` builds.
  cc2-commander:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc2-commander:local
    container_name: cc2-commander
    restart: unless-stopped
    ports:
      - "8088:8088" # Web UI + API + WebSocket
      - "7125:7125" # Moonraker compatibility API
    env_file: [.env]
    volumes:
      # One host path, so the data is easy to get at. Mount the DIRECTORY, never the
      # files inside it.
      - ./elegoo-data:/app/data

  # Development. `docker compose --profile dev up -d --build`

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: cc2-dev
    profiles: [dev]
    # Match the host user so files the container writes into the bind mount — bun.lock
    # after an install, anything a script emits — are not left owned by root.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8088:8088" # Web UI + API + WebSocket
      - "7125:7125" # Moonraker compatibility API
    environment:
      PRINTER_IP: "${PRINTER_IP:-192.168.0.146}"
      # Absolute, and inside the volume. The default is ./data, which would resolve to
      # the bind mount and put the gcode cache back on the host.
      DATA_DIR: /app/data
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      # Playwright reuses a running server unless CI is set; in here it should always
      # start its own harness on :5199.
      CI: "1"
    volumes:
      - .:/app
      # Each of these hides the bind mount at that path.
      - node_modules:/app/node_modules
      - dist:/app/dist
      - data:/app/data
      - test-results:/app/test-results
      - playwright-report:/app/playwright-report
      - playwright-browsers:/ms-playwright
    # `bun run dev` rebuilds and restarts on change; the service alone is the quieter
    # option when you are only editing the server.
    command: ["bun", "scripts/dev.ts"]

volumes:
  node_modules:
  dist:
  data:
  test-results:
  playwright-report:
  playwright-browsers:
